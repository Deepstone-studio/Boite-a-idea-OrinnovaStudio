name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    # La matrice définit des environnements totalement isolés
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
      fail-fast: false # ⚠️ CRITIQUE : Empêche d'annuler un job si l'autre échoue

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Rebuild native modules for Electron
        run: npx @electron/rebuild -f -w better-sqlite3

      # Condition pour cibler uniquement AppImage sur Linux (évite Snapcraft)
      - name: Build & Publish (Linux AppImage)
        if: matrix.os == 'ubuntu-latest'
        run: npx electron-builder --linux AppImage --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Condition pour cibler uniquement NSIS sur Windows
      - name: Build & Publish (Windows Installer)
        if: matrix.os == 'windows-latest'
        run: npx electron-builder --win nsis --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
